          echo '--- daftar berkas ---'
          find . -path ./.git -prune -o -type f -print | sort

      - name: Siapkan keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MENU_URL: ${{ vars.MENU_URL }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease -PMENU_URL="$MENU_URL" -PUPDATE_REPO="$UPDATE_REPO" --no-daemon
          else
            gradle assembleDebug -PMENU_URL="$MENU_URL" -PUPDATE_REPO="$UPDATE_REPO" --no-daemon
          fi
          find app/build/outputs/apk -name "*.apk" -exec cp {} APK-Khusus.apk \;
          ls -la APK-Khusus.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Khusus
          path: APK-Khusus.apk

      - name: Publikasikan ke Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: APK-Khusus.apk
